<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">SpendWise app icon</title>
  <desc id="desc">Rounded dark blue app icon with a 50 30 20 budget ring, wallet symbol, growth bars, and the SpendWise name.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16345D"/>
      <stop offset="100%" stop-color="#07182F"/>
    </linearGradient>

    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#66E39B"/>
      <stop offset="100%" stop-color="#1FAE73"/>
    </linearGradient>

    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4AB0FF"/>
      <stop offset="100%" stop-color="#1F70E8"/>
    </linearGradient>

    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFC24D"/>
      <stop offset="100%" stop-color="#F39A18"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.20"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect x="48" y="48" width="928" height="928" rx="210" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Budget ring: circumference approx 1508.0 -->
  <g transform="rotate(-90 512 420)" fill="none" stroke-width="122" stroke-linecap="butt">
    <circle cx="512" cy="420" r="240"
            stroke="url(#green)"
            stroke-dasharray="754 754"
            stroke-dashoffset="0"/>
    <circle cx="512" cy="420" r="240"
            stroke="url(#blue)"
            stroke-dasharray="452.4 1055.6"
            stroke-dashoffset="-754"/>
    <circle cx="512" cy="420" r="240"
            stroke="url(#orange)"
            stroke-dasharray="301.6 1206.4"
            stroke-dashoffset="-1206.4"/>
  </g>

  <!-- Segment separators -->
  <g stroke="#0A203D" stroke-width="10">
    <line x1="512" y1="119" x2="512" y2="240"/>
    <line x1="752" y1="595" x2="850" y2="666"/>
    <line x1="512" y1="600" x2="512" y2="721"/>
  </g>

  <!-- Percentage labels -->
  <g fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">
    <text x="285" y="438" font-size="64">50%</text>
    <text x="770" y="335" font-size="64">30%</text>
    <text x="650" y="645" font-size="64">20%</text>
  </g>

  <!-- Center content -->
  <g filter="url(#soft)">
    <!-- Growth bars -->
    <g fill="url(#green)">
      <rect x="435" y="335" width="42" height="92" rx="8"/>
      <rect x="491" y="294" width="42" height="133" rx="8"/>
      <rect x="547" y="247" width="42" height="180" rx="8"/>
    </g>

    <!-- Wallet -->
    <path d="M392 433
             H610
             C630 433 646 449 646 469
             V588
             C646 608 630 624 610 624
             H400
             C371 624 348 601 348 572
             V485
             C348 456 371 433 400 433
             Z"
          fill="#FFFFFF"/>

    <path d="M348 492
             C348 466 368 448 395 448
             H584
             V474
             H395
             C382 474 374 481 374 492
             Z"
          fill="#EAF0F7"/>

    <!-- Wallet clasp -->
    <path d="M567 500
             H645
             C661 500 674 513 674 529
             V562
             C674 578 661 591 645 591
             H567
             C540 591 518 569 518 542
             V549
             C518 522 540 500 567 500
             Z"
          fill="#FFFFFF"/>
    <circle cx="578" cy="545" r="13" fill="#0B2342"/>
  </g>

  <!-- Brand -->
  <text x="512" y="860"
        font-family="Arial, Helvetica, sans-serif"
        font-size="92"
        font-weight="700"
        text-anchor="middle"
        fill="#FFFFFF">
    Spend<tspan fill="#35C989">Wise</tspan>
  </text>
</svg>
